# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Astro 5 + React 19 + TypeScript (strict) + Tailwind CSS v4
  Architecture: Static portfolio site with Astro content collections for blog (10 posts)
  Testing: No test runner installed
  Style: Astro components (.astro) + React TSX components, CSS via Tailwind v4
  Commits: Conventional commits (feat/fix/refactor with optional scope)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  runner: none
  layers:
    unit: { available: false, tool: null }
    integration: { available: false, tool: null }
    e2e: { available: false, tool: null }
  coverage: { available: false }
  quality:
    linter: { available: false }
    type_checker: { available: true, command: "astro check" }
    formatter: { available: false }
